global:
  scrape_interval: 15s # Recoger métricas cada 15 segundos

scrape_configs:
  # 1. Monitorear el propio Prometheus
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 2. Monitorear Apache (si tienes cAdvisor o el exportador de Apache configurado en la red docker)
  - job_name: 'apache-server'
    static_configs:
      - targets: ['contenedor-apache:80']
